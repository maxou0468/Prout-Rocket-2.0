<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prout Rocket</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#080d20}
button{border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
#game,#sky{position:fixed;inset:0;overflow:hidden}
#sky{background:linear-gradient(#087dcc,#a9eafa)}
#scene{position:absolute;inset:0;will-change:transform}
#decor{position:absolute;inset:0;pointer-events:none}
#sun,#moon{position:absolute;right:12%;top:12%;width:80px;height:80px;border-radius:50%;background:#fff06a}
#moon{background:#fff7c9}
#moon:after{content:"";position:absolute;left:-15px;top:-8px;width:80px;height:80px;border-radius:50%;background:#101d40}
.cloud{position:absolute;width:90px;height:25px;border-radius:20px;background:rgba(255,255,255,.85)}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.star{position:absolute;background:#fff;border-radius:50%}.star.twinkle{animation:twinkle 2s infinite ease-in-out}

/* Planètes */
.planet{position:absolute;border-radius:50%;box-shadow:inset -6px -6px 12px rgba(0,0,0,.5)}
.planet-mars{background:#c1440e;width:45px;height:45px}
.planet-jupiter{background:linear-gradient(135deg,#c88b3a,#e3dccb 40%,#a56229);width:75px;height:75px}
.planet-saturn{background:#e4d191;width:50px;height:50px}
.planet-saturn:after{content:"";position:absolute;top:50%;left:50%;width:90px;height:18px;border:3px solid rgba(228,209,145,.7);border-radius:50%;transform:translate(-50%,-50%) rotate(-20deg)}
.planet-neptune{background:#4b70dd;width:40px;height:40px}

#ground{position:absolute;bottom:0;left:-5%;width:110%;height:180px;background:#327d2d;border-top:6px solid #28752c}
#player{position:absolute;z-index:10;left:50%;bottom:120px;width:100px;height:145px;transform:translateX(-50%)}

/* Base du personnage */
.head{position:absolute;top:14px;left:29px;width:42px;height:42px;border:3px solid #222;border-radius:50%;background:#f2ad7c;z-index:2}
.eye{position:absolute;top:13px;width:6px;height:7px;border-radius:50%;background:#222;z-index:3}.e1{left:8px}.e2{right:8px}
.body{position:absolute;top:54px;left:20px;width:60px;height:50px;border:3px solid #222;border-radius:13px;background:#df3545;z-index:2}
.arm{position:absolute;top:59px;width:14px;height:38px;border-radius:10px;background:#f2ad7c;border:2px solid #222;z-index:1}.a1{left:10px;transform:rotate(22deg)}.a2{right:10px;transform:rotate(-22deg)}
.leg{position:absolute;top:100px;width:17px;height:35px;border-radius:10px;background:#222;z-index:1}.l1{left:29px}.l2{right:29px}

/* --- SKINS AMÉLIORÉS ET SOIGNÉS --- */
/* Astronaute : Bulle parfaitement centrée autour de la tête */
.helmet-glass{position:absolute;top:4px;left:19px;width:62px;height:62px;border:3px solid #222;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(200,245,255,0.85), rgba(30,100,160,0.65));z-index:5;pointer-events:none}
.helmet-glass:after{content:"";position:absolute;top:9px;left:11px;width:18px;height:9px;background:rgba(255,255,255,0.85);border-radius:10px;transform:rotate(-30deg)}

/* Ninja : Éléments réorganisés et mieux proportionnés */
.ninja-mask{position:absolute;top:26px;left:27px;width:46px;height:26px;background:#111;border:2px solid #000;border-radius:0 0 18px 18px;z-index:4}
.ninja-band{position:absolute;top:10px;left:23px;width:54px;height:13px;background:#cc0000;border:2px solid #222;border-radius:4px;z-index:4}
.ninja-ribbon{position:absolute;top:12px;right:10px;width:22px;height:26px;background:#cc0000;border:2px solid #222;clip-path:polygon(0 0, 100% 50%, 0 100%);z-index:3;transform:rotate(10deg)}

/* Robot : Alignement du corps métallique et de l'antenne */
.robot-head{border-radius:8px !important;background:#8a9ba8 !important}
.robot-eye{background:#00ffcc !important;box-shadow:0 0 8px #00ffcc}
.robot-body{border-radius:8px !important;background:#5a6b7c !important}
.robot-antenna{position:absolute;top:-14px;left:47px;width:6px;height:28px;background:#222;z-index:4}
.robot-antenna:after{content:"";position:absolute;top:-8px;left:-5px;width:16px;height:16px;background:#ff2a2a;border:2px solid #222;border-radius:50%;box-shadow:0 0 8px #ff2a2a}

/* Roi : Couronne posée sur la tête et col en fourrure posé sur les épaules */
.king-crown{position:absolute;top:-12px;left:26px;width:48px;height:28px;background:linear-gradient(#ffe066,#ffd700);border:2px solid #222;clip-path:polygon(0% 100%, 100% 100%, 100% 10%, 80% 45%, 50% 0%, 20% 45%, 0% 10%);z-index:5}
.king-fur{position:absolute;top:47px;left:14px;width:72px;height:18px;background:#fff;border:2px solid #222;border-radius:10px;z-index:4;box-shadow:inset 0 -3px 0 #ddd}

/* Effet de propulsion prout */
.poof{position:absolute;z-index:9;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(150,220,150,.4) 60%,transparent);pointer-events:none;animation:poofAnim .4s ease-out forwards}
@keyframes poofAnim{0%{transform:translate(-50%,0) scale(.3);opacity:.9}100%{transform:translate(-50%,45px) scale(var(--max-scale, 1.8));opacity:0}}

@keyframes firePulse{0%,100%{transform:translate(-50%,-40%) scale(1)}50%{transform:translate(-50%,-35%) scale(1.2)}}
#fireShield{position:absolute;top:50%;left:50%;width:150px;height:180px;transform:translate(-50%,-40%);border-radius:50% 50% 40% 40%;background:radial-gradient(circle,rgba(255,255,200,.95) 0%,rgba(255,140,0,.85) 45%,transparent 100%);display:none;pointer-events:none;z-index:12;animation:firePulse .12s infinite}
.info{position:absolute;z-index:30;padding:8px 10px;background:#101b2ddd;border-radius:9px;font-weight:700;font-size:14px}
.i1{top:10px;left:10px}.i2{top:47px;left:10px}.i3{top:84px;left:10px}.i4{top:10px;right:10px}
#bar{position:absolute;z-index:30;top:125px;left:10px;width:150px;height:7px;background:#ffffff55;border-radius:8px}
#fill,#af{height:100%;width:0;background:#ffd21f;border-radius:8px}
#alt{position:absolute;z-index:30;right:10px;top:50%;width:12px;height:65vh;background:#ffffff45;border-radius:20px;transform:translateY(-50%)}
#af{position:absolute;bottom:0;width:100%;height:0}
#at{position:absolute;right:18px;bottom:0;background:#ffd21f;color:#222;padding:7px;border-radius:8px;font-size:12px;white-space:nowrap}
#launchButton{position:absolute;z-index:40;bottom:18px;left:50%;transform:translateX(-50%);width:220px;height:65px;background:#ffd21f;font-size:24px;color:#222}
#pauseButton,#menuButton{position:absolute;z-index:40;bottom:18px;width:60px;height:55px;background:#fff;color:#222;font-size:20px}
#pauseButton{right:10px}#menuButton{left:10px}
.screen{position:absolute;z-index:100;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:#071522ed}
.screen.show{display:flex}
.title{font-size:36px;font-weight:900;margin-bottom:18px}
.panel{width:min(400px,94vw);max-height:75vh;overflow:auto;padding:12px;border-radius:18px;background:#ffffff12}
.menu{width:100%;margin:6px 0;background:#fff;color:#17252d;font-size:16px}
.item{margin:10px 0;padding:12px;border-radius:12px;background:#ffffff14}
.item-desc{font-size:13px;color:#ffd21f;margin:4px 0 8px 0;font-weight:bold}
.stat,.toggle{margin:7px 0;padding:10px;border-radius:12px;background:#ffffff14}
#home{background:linear-gradient(#1590dc,#71d5ff 70%,#e5faff)}
#playHome{width:230px;height:70px;background:#ffd21f;font-size:26px;color:#222}
#shopHome{width:200px;margin-top:12px;background:#fff;color:#222}
.bottom{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 12px}
.bottom button{background:#fff;color:#222}
input{width:100%;padding:13px;border:0;border-radius:10px;font-size:17px;margin-bottom:10px}
</style>
</head>
<body>
<div id="game">
  <div id="sky"><div id="scene"><div id="sun"></div><div id="moon" style="display:none"></div><div id="decor"></div><div id="ground"></div><div id="player"><div id="fireShield"></div></div></div></div>
  <div class="info i1" id="height">Altitude : 0 m</div><div class="info i2" id="level">Niveau 1</div><div class="info i3" id="coins">🪙 0</div><div class="info i4" id="target">Objectif : 100 m</div>
  <div id="bar"><div id="fill"></div></div><div id="alt"><div id="af"></div><div id="at">0 m</div></div>
  <button id="menuButton">☰</button><button id="pauseButton">Ⅱ</button><button id="launchButton">PROUT ! 💨</button>
  <audio id="p1" src="prout1.mp3"></audio><audio id="p2" src="prout2.mp3"></audio><audio id="p3" src="prout3.mp3"></audio><audio id="p4" src="prout4.mp3"></audio><audio id="landingSound" src="atterrissage.mp3"></audio>
</div>

<div id="home" class="screen show">
  <h1>💨 PROUT ROCKET</h1>
  <button id="playHome">🚀 JOUER</button><button id="shopHome">🛒 BOUTIQUE</button>
  <div class="bottom"><button id="promoHome">🎁 CODE PROMO</button><button id="settingsHome">⚙️ PARAMÈTRES</button></div>
</div>

<div id="menu" class="screen"><div class="title">💨 PROUT ROCKET</div><div class="panel"><button class="menu" onclick="play()">🚀 JOUER</button><button class="menu" onclick="shop()">🛒 BOUTIQUE</button><button class="menu" onclick="promo()">🎁 CODE PROMO</button><button class="menu" onclick="stats()">📊 STATISTIQUES</button><button class="menu" onclick="settings()">⚙ PARAMÈTRES</button></div></div>
<div id="shop" class="screen"><div class="title">🛒 BOUTIQUE</div><div id="shopList" class="panel"></div><button class="menu" onclick="play()">🚀 JOUER</button><button class="menu" onclick="openMenu()">⬅ MENU</button></div>
<div id="promo" class="screen"><div class="title">🎁 CODE PROMO</div><div class="panel"><input id="promoInput" placeholder="Entre ton code"><button class="menu" onclick="usePromo()">VALIDER</button><p id="promoMsg"></p></div><button class="menu" onclick="openMenu()">⬅️ MENU</button></div>
<div id="stats" class="screen"><div class="title">📊 STATISTIQUES</div><div id="statsList" class="panel"></div><button class="menu" onclick="openMenu()">⬅️ MENU</button></div>
<div id="settings" class="screen"><div class="title">⚙️ PARAMÈTRES</div><div class="panel"><div class="toggle">✨ Effets <button id="effects" onclick="tog('effects')">ON</button></div><div class="toggle">🔊 Sons <button id="sound" onclick="tog('sound')">ON</button></div><button class="menu" id="resetBtn">🗑️ RÉINITIALISER</button></div><button class="menu" onclick="openMenu()">⬅️ MENU</button></div>
<div id="pauseScreen" class="screen"><div class="title">⏸️ PAUSE</div><div id="count" style="font-size:80px;font-weight:900"></div><button class="menu" onclick="resume()">▶️ REPRENDRE</button><button class="menu" onclick="openMenu()">☰ MENU</button></div>

<script>
const $=id=>document.getElementById(id), 
chars=[
  ["base","Prouteur 🙂",0,"Skin de base d'origine"],
  ["space","Astronaute 👨‍🚀",100,"+25% d'impulsion de prout"],
  ["ninja","Ninja 🥷",250,"+35% d'impulsion de prout"],
  ["robot","Robot 🤖",500,"+50% d'impulsion de prout"],
  ["king","Roi 👑",1000,"+50% de pièces récoltées"]
];
let s={}, level, coins, target, alt=0, vel=0, started=0, paused=1, falling=0, counting=0, landingPlayed=0, fallDuration=0, last=performance.now();
let comboProut=0, lastProutTime=0;
const SCALE=2.5, CHUNK=300, loaded=new Map();

function initSave(){
  try{s=JSON.parse(localStorage.getItem("proutSave")||"{}")}catch(e){s={}}
  s={level:+s.level||1,coins:+s.coins||0,owned:Array.isArray(s.owned)?s.owned:["base"],selected:s.selected||"base",promos:s.promos||[],prouts:+s.prouts||0,max:+s.max||0,effects:s.effects!==false,sound:s.sound!==false,dev:!!s.dev};
  level=s.level; coins=s.coins; target=level*100;
}
initSave();

const save=()=>{s.level=level;s.coins=coins;s.max=Math.max(s.max,alt);localStorage.setItem("proutSave",JSON.stringify(s));};
const hide=()=>document.querySelectorAll(".screen").forEach(e=>e.classList.remove("show"));
const resetDecor=()=>{$("decor").innerHTML="";loaded.clear();};

function play(){started=1;paused=counting=falling=landingPlayed=fallDuration=alt=vel=comboProut=0;resetDecor();last=performance.now();hide();skin();update();}
function openMenu(){hide();$("menu").classList.add("show");paused=1;}

$("playHome").onclick=play; $("shopHome").onclick=shop; $("promoHome").onclick=promo; $("settingsHome").onclick=settings;

function skin(){
  let skinType = s.selected || "base";
  let headClass = "head", bodyClass = "body", eyeClass = "eye", extraHTML = "";

  if(skinType === "base"){
    extraHTML = ''; // Personnage de base sans casquette
  } else if(skinType === "space"){
    extraHTML = '<div class="helmet-glass"></div>';
  } else if(skinType === "ninja"){
    extraHTML = '<div class="ninja-band"></div><div class="ninja-mask"></div><div class="ninja-ribbon"></div>';
  } else if(skinType === "robot"){
    headClass += " robot-head";
    bodyClass += " robot-body";
    eyeClass += " robot-eye";
    extraHTML = '<div class="robot-antenna"></div>';
  } else if(skinType === "king"){
    extraHTML = '<div class="king-crown"></div><div class="king-fur"></div>';
  }

  let bodyColor = {base:"#df3545",space:"#f0f0f0",ninja:"#1a1a1a",robot:"#5a6b7c",king:"#8b008b"}[skinType];

  $("player").innerHTML=`
    <div id="fireShield"></div>
    <div class="${headClass}"><i class="${eyeClass} e1"></i><i class="${eyeClass} e2"></i></div>
    <div class="${bodyClass}" style="background:${bodyColor}"></div>
    <div class="arm a1"></div><div class="arm a2"></div>
    <div class="leg l1"></div><div class="leg l2"></div>
    ${extraHTML}
  `;
}

function prout(){
  if(!started||paused||counting||falling)return;
  s.prouts++;
  let now = performance.now();
  
  if(now - lastProutTime < 400){
    comboProut = Math.min(comboProut + 1, 10);
  } else {
    comboProut = 1;
  }
  lastProutTime = now;

  let mult = 1;
  if(s.selected === "space") mult = 1.25;
  else if(s.selected === "ninja") mult = 1.35;
  else if(s.selected === "robot") mult = 1.50;

  let f = (s.dev ? 200 : 22) * mult;
  vel = Math.min(s.dev ? 1000 : 90, vel + f);
  
  if(s.effects){
    let pf=document.createElement("div");
    let baseSize = 30 + comboProut * 8;
    let maxScale = 1.5 + comboProut * 0.35;
    
    pf.className="poof";
    pf.style.setProperty('--max-scale', maxScale);
    pf.style.cssText+=`width:${baseSize}px;height:${baseSize}px;left:50%;bottom:${110+alt*SCALE}px`;
    $("scene").appendChild(pf);
    setTimeout(()=>pf.remove(),400);
  }

  if(s.sound){let a=$("p"+(1+Math.floor(Math.random()*4)));if(a){a.currentTime=0;a.play().catch(()=>{});}}
  save();
}

$("launchButton").addEventListener("pointerdown",prout,{passive:true});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();prout();}});
$("pauseButton").onclick=()=>{if(started&&!paused&&!counting){paused=1;$("pauseScreen").classList.add("show");}};
$("menuButton").onclick=()=>{if(started)openMenu();};

function resume(){
  if(counting)return;
  $("pauseScreen").classList.remove("show"); counting=1; let n=3;
  $("count").textContent=n;
  let t=setInterval(()=>{n--;$("count").textContent=n>0?n:"GO !";if(n<0){clearInterval(t);hide();paused=counting=0;last=performance.now();}},1000);
}

function shop(){hide();$("shop").classList.add("show");paused=1;renderShop();}
function renderShop(){
  $("shopList").innerHTML=chars.map(c=>`
    <div class="item">
      <b>${c[1]}</b>
      <div class="item-desc">✨ ${c[3]}</div>
      <button onclick="buy('${c[0]}')">${s.selected===c[0]?"✅ ÉQUIPÉ":s.owned.includes(c[0])?"🎮 ÉQUIPER":"🪙 "+c[2]}</button>
    </div>
  `).join("");
}

function buy(id){
  let c=chars.find(x=>x[0]===id); if(!c)return;
  if(s.owned.includes(id)){s.selected=id;skin();save();renderShop();return;}
  if(!s.dev&&coins<c[2])return alert("Pas assez !");
  if(!s.dev)coins-=c[2];
  s.owned.push(id);s.selected=id;skin();save();renderShop();update();
}

function promo(){hide();$("promo").classList.add("show");paused=1;}
function usePromo(){
  let c=$("promoInput").value.trim();
  if(!c)return $("promoMsg").textContent="Entre un code";
  if(s.promos.includes(c))return $("promoMsg").textContent="Déjà utilisé";
  if(c==="MAXOU"){coins+=500;s.promos.push(c);save();return $("promoMsg").textContent="🎉 +500 !";}
  if(c==="Dev"){s.dev=1;s.promos.push(c);coins=999999999;save();return $("promoMsg").textContent="🛠 DEV OK !";}
  $("promoMsg").textContent="❌ Invalide";
}

function stats(){hide();$("stats").classList.add("show");paused=1;$("statsList").innerHTML=`<div class="stat">🏆 Niv ${level}</div><div class="stat">📏 Max ${Math.floor(s.max)} m</div><div class="stat">💨 Prouts ${s.prouts}</div><div class="stat">🪙 ${s.dev?"∞":coins}</div>`;}
function settings(){hide();$("settings").classList.add("show");paused=1;updateSet();}
function tog(x){s[x]=!s[x];save();updateSet();}
function updateSet(){$("effects").textContent=s.effects?"ON":"OFF";$("sound").textContent=s.sound?"ON":"OFF";}

$("resetBtn").onclick=()=>{
  if(confirm("Réinitialiser ?")){
    localStorage.removeItem("proutSave");
    initSave(); skin(); update(); updateSet();
    alert("Réinitialisé !");
  }
};

function physics(dt){
  if(!started||paused||counting)return;
  if(!falling){
    vel-=30*dt; alt+=vel*dt; fallDuration=0;
    if(alt<0)alt=vel=0;
    if(alt>=target&&!s.dev){alt=target;vel=0;falling=1;landingPlayed=0;}
    if(s.dev&&alt>=target){while(alt>=target){level++;target=level*100;}}
  }else{
    vel-=(40+fallDuration*35)*dt; alt+=vel*dt; fallDuration+=dt;
    let sh=$("fireShield");
    if(sh)sh.style.display=(fallDuration>.5&&vel<-40&&alt>15)?"block":"none";
    
    let timeToImpact = vel < 0 ? alt / Math.abs(vel) : 999;
    if(!landingPlayed && s.sound && timeToImpact <= 1.5 && alt > 0){
      landingPlayed = 1;
      let a = $("landingSound");
      if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
    }

    if(alt<=0){alt=vel=falling=fallDuration=0;if(sh)sh.style.display="none";coins+=20*(s.selected==="king"?1.5:1);level++;target=level*100;save();}
  }
}

function environment(){
  $("sky").style.background=`linear-gradient(#${alt<2000?"087dcc":alt<10000?"101d40":"000000"},#${alt<2000?"a9eafa":alt<10000?"071027":"000000"})`;
  $("sun").style.display=alt<2000?"block":"none";
  $("moon").style.display=(alt>=2000&&alt<10000)?"block":"none";
}

function generateChunk(idx){
  let c=document.createElement("div");
  c.style.cssText=`position:absolute;width:100%;height:${CHUNK*SCALE}px;bottom:${idx*CHUNK*SCALE}px`;
  if(idx===0){$("decor").appendChild(c);return c;}
  let start=idx*CHUNK;
  
  if(start<2000){
    for(let i=0;i<2;i++){let e=document.createElement("div");e.className="cloud";e.style.left=Math.random()*70+"%";e.style.bottom=Math.random()*80+"%";c.appendChild(e);}
  }else{
    let numStars=(start<10000)?10:20;
    for(let i=0;i<numStars;i++){
      let e=document.createElement("div"),sz=1.5+Math.random()*2.5;e.className="star"+(Math.random()>.4?" twinkle":"");
      e.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*98}%;bottom:${Math.random()*98}%`;c.appendChild(e);
    }
    if(start>=10000){
      const planets=["mars","jupiter","saturn","neptune"];
      if(idx%3===0){
        let p=document.createElement("div");
        p.className="planet planet-"+planets[Math.floor(Math.random()*planets.length)];
        p.style.left=10+Math.random()*70+"%";
        p.style.bottom=20+Math.random()*60+"%";
        c.appendChild(p);
      }
    }
  }
  $("decor").appendChild(c); return c;
}

function updateDecor(){
  let cur=Math.floor(alt/CHUNK);
  for(let i=cur-1;i<=cur+1;i++)if(i>=0&&!loaded.has(i))loaded.set(i,generateChunk(i));
  for(let [k,v] of loaded.entries())if(k<cur-1||k>cur+1){v.remove();loaded.delete(k);}
}

function update(){
  $("height").textContent="Altitude : "+Math.floor(alt)+" m";
  $("at").textContent=Math.floor(alt)+" m";
  $("level").textContent="Niveau "+level;
  $("coins").textContent="🪙 "+(s.dev?"∞":Math.floor(coins));
  $("target").textContent="Objectif : "+target+" m";
  let p=Math.min(100,(alt/target)*100);
  $("fill").style.width=p+"%";
  $("af").style.height=p+"%";
  $("at").style.bottom=p+"%";
  let r=alt*SCALE, camY=r>150?r-150:0;
  $("player").style.bottom=(120+r)+"px";
  $("scene").style.transform=`translate3d(0,${camY}px,0)`;
  environment(); updateDecor();
}

function loop(t){
  physics(Math.min((t-last)/1000,.033)); last=t; update(); requestAnimationFrame(loop);
}

skin(); renderShop(); updateSet(); update(); requestAnimationFrame(loop);
</script>
</body>
</html>
